	<script>
		function closeHome(url){
			var i = 0;
			var terminal = document.getElementById("term");
			var speed = 50;

			txt = "clear";
			terminal.innerHTML = "<b>visitor@improveops.me</b>:~$ man improveops.me<br><b>visitor@improveops.me</b>:~$ ";

			setTimeout(typeOut2, 500);


			function typeOut2(){
				if(i < txt.length){
					terminal.innerHTML += txt.charAt(i);
					i++;
					setTimeout(typeOut2, speed);
				}else{
					console.log(url);
					setTimeout(function(){window.location=url;}, 500);
					return false;
				}
			}
		}
	</script>

	<!-- Main Content -->
	<div class="content">
		<div id="term"><b>visitor@improveops.me</b>:~$ </div>

		<script>
			function load(){
					setTimeout(typeOut, 1000);
			}

			var i = 0;
			var txt = "./blog-interface.sh";
			var speed = 50; /* Milliseconds */

			function typeOut(){
				if(i < txt.length){
					document.getElementById("term").innerHTML += txt.charAt(i);
					i++;
					setTimeout(typeOut,speed);
				}else{
					setTimeout(list, 500);
				}
			}

			function list(){
				document.getElementById("term").innerHTML =`
					<div class="blog-list">

			}

	<script>
		window.onscroll = function(){navStick()};
		var navbar = document.getElementById("topnav");
		var sticky = navbar.offsetTop;
		function navStick(){
			if(window.pageYOffset >= sticky){
				navbar.classList.add("sticky");
			}else{
				navbar.classList.remove("sticky");
			}
		}
	</script>
