	<script>
		var done = false;
		var cmds = '"about-me.txt" 25L, 1560C';
		function closeAbout(url){
			done = true;
			var terminal = document.getElementById("term");
			var toDisplay1 = `
					<div id="vim">
						Work in progress<br>
						<span style="color: darkblue;">
						~<br>
						~<br>
						~<br>
						~<br>
						~<br>
						~<br>
						~<br>
						</span>
						`;

						var toDisplay2 = `
					</div>

					`

					var i = 0;
					var txt = ":q";
					var speed = 50;

					typeOut2();

					function typeOut2(){
						if(cmds === '"about-me.txt" 25L, 1560C'){
							cmds = "";
							terminal.innerHTML = toDisplay1 + cmds + toDisplay2;
							setTimeout(typeOut2, speed);
						}else if(i < txt.length){
							cmds += txt.charAt(i);
							i++;
							terminal.innerHTML = toDisplay1 + cmds + toDisplay2;
							setTimeout(typeOut2, speed);
						}else{
							i = 0;
							txt = "clear";
							speed = 50;
							setTimeout(typeOut3,400);
						}
					}

					function typeOut3(){
						if(cmds === ":q"){
							cmds = "";
							terminal.innerHTML = "<b>visitor@improveops.me</b>:~$ vim about-me.txt<br><b>visitor@improveops.me</b>:~$ ";
							setTimeout(typeOut3, 300);
						}else if(i < txt.length){
							terminal.innerHTML += txt.charAt(i);
							i++;
							setTimeout(typeOut3, speed);
						}else{
							setTimeout(function(){window.location=url;}, 400);
							return false;
						}
					}
		}
	</script>

	<!-- Main Content -->
	<div class="content">
		<div id="term"><b>visitor@improveops.me</b>:~$ </div>

		<script>
			var i = 0;
			var txt = "vim about-me.txt";
			var speed = 50; /* Milliseconds */

			function typeOut(){
				if(i < txt.length){
					document.getElementById("term").innerHTML += txt.charAt(i);
					i++;
					if(i < txt.length){
						setTimeout(typeOut,speed);
					}else{
						setTimeout(typeOut, 500);
					}
				}else{
					printAbout(0);
				}
			}

			function printAbout(x){
				var speed = 500;
				var cmds = '"about-me.txt" 25L, 1560C';

				if(done === true){
					return;
				}

				if(x === 0){
					document.getElementById("term").innerHTML = `

              Work in progress.

					</div>

					`
					setTimeout(function(){printAbout(1);}, speed);
				}else{
					document.getElementById("term").innerHTML = `
					<div id="vim">
						<br>

					Work in progress.<span style="display:inline;color:#28FE14;height:10px;width:10px;background-color:#28FE14;">l</span><br>

						~<br>
						~<br>
						~<br>
						</span>
						` + cmds + `

					`

				}
			}
